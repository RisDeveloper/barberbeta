<style>
*{box-sizing:border-box}body{margin:0}
.app{display:grid;grid-template-columns:248px 1fr;background:#F0F4F9;color:#202124;font:14px/1.4 Inter,Roboto,Arial,sans-serif}
.side{padding:20px 12px}.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 6px;font-size:20px;font-weight:600}
.logo{width:34px;height:34px;border-radius:12px;background:#1A73E8;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.portal{margin:0 12px 14px;font-size:12px;color:#5F6368}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:24px;color:#202124;text-decoration:none}
.nav a:hover{background:#E4EAF3}.nav a.on{background:#C2E7FF;font-weight:600}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.main{padding:20px 28px 28px 12px;min-width:0}
.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.top h1{margin:0;font-size:24px;font-weight:500;flex:1}
.search{height:44px;width:300px;border-radius:24px;background:#fff;border:1px solid #DADCE0;padding:0 18px;display:flex;align-items:center;color:#5F6368}
.av{width:36px;height:36px;border-radius:50%;background:#EADDFF;display:grid;place-items:center;font-weight:600;flex:none}
.card{background:#fff;border:1px solid #DADCE0;border-radius:20px;padding:20px}.card h2{margin:0 0 14px;font-size:16px;font-weight:600}
.grid{display:grid;gap:16px}.stat small{color:#5F6368;display:block;margin-bottom:6px}.stat b{font-size:24px;font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}
.ok{background:#C4EED0;color:#0D652D}.late{background:#FEF3C7;color:#7A4F00}.bad{background:#FCE8E6;color:#A50E0E}.info{background:#C2E7FF;color:#0B3C7A}.mute{background:#F1F3F4;color:#5F6368}
table{width:100%;border-collapse:collapse}th{text-align:left;color:#5F6368;font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid #DADCE0}td{padding:10px;border-bottom:1px solid #F1F3F4}
.btn{height:44px;padding:0 24px;border-radius:22px;border:0;background:#1A73E8;color:#fff;font:600 14px Inter,sans-serif}.btn.t{background:#fff;color:#1A73E8;border:1px solid #DADCE0}.btn.w{width:100%}
.tile{border:1px solid #DADCE0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;background:#fff}.tile small{color:#5F6368}.tile.sel{border:2px solid #1A73E8;background:#F0F7FF}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F1F3F4}.row span{color:#5F6368}
.bars{display:flex;align-items:flex-end;gap:14px;height:140px}.bars i{flex:1;border-radius:10px 10px 4px 4px;background:#C2E7FF}.bars i.hi{background:#1A73E8}
.lbl{display:flex;gap:14px;margin-top:6px;font-size:12px;color:#5F6368}.lbl span{flex:1;text-align:center}
.sw i{display:block;height:48px;border-radius:14px;border:1px solid #DADCE0;margin-bottom:6px}.sw b{font-size:12px;display:block}.sw small{font-size:11px;color:#5F6368}
.tag{font-size:12px;color:#5F6368}
</style>
</helmet>
