<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FED950">
<title>TheSystem – Member</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FED950;--bg:#F8F7F2;--sf:#fff;--tx:#292821;--t2:#6f6d64;--bd:#E8E5DA;--mu:#F1EFE7;--dk:#24231F;--r:16px;--cream:color-mix(in srgb,var(--y) 24%,var(--sf));--sh:0 1px 2px rgba(36,35,31,.04),0 6px 18px rgba(36,35,31,.05);--zm:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#1b1a17;--sf:#26251f;--tx:#f3f1e8;--t2:#a9a699;--bd:#38362d;--mu:#302e26;--sh:none;color-scheme:dark}
:root[data-hc]{--bd:#8a877a;--t2:#4a483f}:root[data-theme=dark][data-hc]{--bd:#8d8a7c;--t2:#d6d3c6}
:root[data-rm] *{animation:none!important;transition:none!important}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:13px/1.45 'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #D6A91F;outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.logo{width:42px;height:42px;border-radius:13px;background:var(--y);color:#292821;display:grid;place-items:center;font-weight:800;font-size:17px}
#app{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100%}
aside{position:sticky;top:0;height:100vh;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
aside .logo{margin-bottom:12px}
.nv{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:14px;font-size:10.5px;font-weight:600;color:var(--t2);position:relative;min-height:44px;transition:background .2s}
.nv:hover{background:var(--mu)}.nv.on{background:var(--cream);color:var(--tx)}
.nv.on:before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--y)}
main{min-width:0}
header{display:flex;align-items:center;gap:12px;padding:14px clamp(14px,3vw,28px);position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
header h1{font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);display:grid;place-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:800;color:#292821}
#pg{width:100%;max-width:1100px;margin:0 auto;padding:4px clamp(14px,3vw,28px) 40px;zoom:var(--zm)}
.grid{display:grid;gap:var(--gp,14px)}.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.mb{margin-bottom:var(--gp,14px)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px}
.lbl{color:var(--t2);font-size:12px;font-weight:500}.kpi{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.02em}
.feat{background:var(--y);border-color:transparent;color:#292821}.feat .lbl{color:#4d4a3b}
.fh{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.fh h2{margin:0;flex:1;min-width:120px}
.bd{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--mu);white-space:nowrap}
.bd.ok{background:#e3f0e7;color:#2f6a43}.bd.wa{background:var(--cream)}
:root[data-theme=dark] .bd.ok{background:#25392c;color:#9fd3b0}
.code{background:#fff;color:#292821;border:2px dashed #292821;border-radius:14px;padding:12px 14px;text-align:center;font-weight:800;letter-spacing:.08em;font-size:16px}
.code small{display:block;font-weight:500;letter-spacing:0;font-size:10.5px;color:#4d4a3b}
.pb{height:8px;border-radius:9px;background:rgba(41,40,33,.18);margin-top:6px}.pb i{display:block;height:100%;border-radius:9px;background:#292821}
.sr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--bd);width:100%;text-align:left;min-height:48px}
h2+.sr,.fh+.sr{border-top:0}.sr b,.sr .lbl{display:block}.sr.v{flex-direction:column;align-items:stretch;gap:10px}
.btn{width:100%;background:var(--y);color:#292821;font-weight:800;border-radius:14px;min-height:48px;font-size:14px;transition:filter .15s}
.btn:hover{filter:brightness(.96)}.btn:disabled{background:var(--mu);color:var(--t2);cursor:not-allowed}.btn.alt{background:var(--mu);color:var(--tx)}
.fh .btn{width:auto;padding:0 16px;min-height:42px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--t2);font-weight:600;font-size:12px;padding:8px 10px}td{padding:12px 10px;border-top:1px solid var(--bd)}
.cards{display:none}.rc{padding:14px;border:1px solid var(--bd);border-radius:14px;display:grid;gap:6px;margin-top:10px}.rc div{display:flex;justify-content:space-between;gap:8px}
.set{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--mu);border-radius:12px;padding:4px;gap:4px}
.seg3 button{padding:10px 6px;border-radius:9px;font-weight:700;min-height:44px;font-size:12px}.seg3 .on{background:var(--y);color:#292821}
.sws{display:flex;gap:12px}.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1.5px var(--bd)}.sw.on{box-shadow:0 0 0 2.5px var(--tx)}
.tg{width:48px;height:28px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--y)}.tg.on:after{transform:translateX(20px);background:#292821}
nav.bn{display:none}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(36,35,31,.45)}#sheet.o{display:block}
#sh{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:var(--sf);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;animation:u .22s ease-out}
@keyframes u{from{transform:translateY(40px);opacity:0}}
#sh input,.lc input{width:100%;min-height:48px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:10px 14px;margin:4px 0 8px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dk);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}#toast.o{opacity:1}
#login{position:fixed;inset:0;z-index:40;background:#24231F;display:grid;place-items:center;padding:20px;overflow:auto;--sf:#24231F;--tx:#f3f1e8;--t2:#b9b6a8;--bd:#4a483e}
.lc{width:100%;max-width:400px;background:#2f2d27;border-radius:24px;padding:28px;color:#f3f1e8}.lc .logo{margin:0 auto 14px}
.lc h1{text-align:center;font-size:20px}.lc p{text-align:center;color:#b9b6a8;margin:2px 0 16px}.lc label{font-size:12px;color:#b9b6a8}
.lc #le{color:#e99;min-height:18px;margin:4px 0 8px;font-weight:600}.lc small{display:block;text-align:center;color:#b9b6a8;margin-top:12px}
@media(max-width:1023px){.two,.set{grid-template-columns:1fr}#app{grid-template-columns:84px minmax(0,1fr)}}
@media(max-width:767px){.tb{display:none}.cards{display:block}}
@media(max-width:599px){#app{display:block}aside{display:none}header{padding:10px 14px}#pg{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
nav.bn{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--sf);border:1px solid var(--bd);border-radius:26px;padding:6px;box-shadow:0 8px 28px rgba(36,35,31,.16)}
nav.bn .nv{flex:1;min-width:0;border-radius:20px;font-size:10px;padding:8px 0}nav.bn .nv.on{background:var(--y);color:#292821}nav.bn .nv.on:before{display:none}}
</style>
</head>
<body>
<div id="login" hidden>
<form class="lc" id="lf" autocomplete="on">
<div class="logo">TS</div><h1>TheSystem</h1><p>Masuk member BarberStory</p>
<label for="ph">No. HP</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" required>
<label for="pn">PIN</label><input id="pn" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required>
<div id="le" role="alert"></div><button class="btn" id="lb">Masuk</button>
<small>Terlalu banyak percobaan akan mengunci sementara.</small>
</form>
</div>
<div id="app" hidden>
<aside id="sb"></aside>
<main>
<header><h1 id="ttl"></h1><button class="ib" id="gb" aria-label="Pengaturan"></button><div class="av" id="avt"></div></header>
<div id="pg"></div>
</main>
</div>
<nav class="bn" id="bn" hidden></nav>
<div id="sheet"><div id="sh"></div></div>
<div id="toast" role="status"></div>
<script>
const $=i=>document.getElementById(i);
const P={home:"M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z",gift:"M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z",rec:"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6",user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8",set:"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp "+Number(n).toLocaleString("id-ID");
const dt=d=>new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
const sg=n=>(n>0?"+":"\u2212")+Math.abs(n);
const NAV=[["home","Beranda","home"],["rewards","Hadiah","gift"],["history","Riwayat","rec"],["profile","Profil","user"]];
let D=null,page=(location.hash||"#home").slice(1);
/* ---- pengaturan tampilan ---- */
const DF={mode:"auto",acc:"#FED950",fs:1,dn:"n",rd:16,hc:0,rm:0};let C={...DF};
try{Object.assign(C,JSON.parse(localStorage.getItem("ts-set")||"{}"))}catch(e){}
const mq=matchMedia("(prefers-color-scheme: dark)");
function apply(){const r=document.documentElement,s=r.style,c=C.dn==="c";r.dataset.theme=C.mode==="auto"?(mq.matches?"dark":"light"):C.mode;s.setProperty("--y",C.acc);s.setProperty("--zm",C.fs);s.setProperty("--r",C.rd+"px");s.setProperty("--gp",c?"10px":"14px");r.toggleAttribute("data-hc",!!C.hc);r.toggleAttribute("data-rm",!!C.rm);try{localStorage.setItem("ts-set",JSON.stringify(C))}catch(e){}}
mq.onchange=()=>{if(C.mode==="auto")apply()};
/* ---- API ---- */
async function api(p,o={}){const r=await fetch("/api/customer"+p,{method:o.method||"GET",credentials:"same-origin",headers:{"Content-Type":"application/json","X-Requested-With":"fetch",...(o.h||{})},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Terjadi kesalahan"),{status:r.status});return j}
async function load(){try{D=await api("/me");$("login").hidden=true;$("app").hidden=false;$("bn").hidden=false;render()}catch(e){if(e.status===401){$("app").hidden=true;$("bn").hidden=true;$("login").hidden=false}else toast(e.message)}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("o");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("o"),2400)}
const sheet=h=>{$("sh").innerHTML=h;$("sheet").classList.add("o")},closeSheet=()=>$("sheet").classList.remove("o");
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("lf").onsubmit=async e=>{e.preventDefault();const b=$("lb");b.disabled=true;$("le").textContent="";try{await api("/login",{method:"POST",body:{phone:$("ph").value,pin:$("pn").value}});$("pn").value="";await load()}catch(x){$("le").textContent=x.message}b.disabled=false};
/* ---- komponen ---- */
const tbl=(c,r)=>`<div class="tb"><table><tr>${c.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(w=>`<tr>${w.map((v,i)=>`<td>${i?v:`<b>${v}</b>`}</td>`).join("")}</tr>`).join("")}</table></div><div class="cards">${r.map(w=>`<div class="rc"><div><b>${w[0]}</b>${w[w.length-1]}</div>${w.slice(1,-1).map((v,i)=>`<div><span class="lbl">${c[i+1]}</span><span>${v}</span></div>`).join("")}</div>`).join("")}</div>`;
const pts=n=>`<span class="bd ${n>0?"ok":""}">${sg(n)}</span>`;
const led=l=>l.map(h=>`<div class="sr"><div><b>${E(h.note)}</b><span class="lbl">${dt(h.date)}</span></div>${pts(h.points)}</div>`).join("")||`<p class="lbl">Belum ada aktivitas.</p>`;
const status=(p,r)=>{const ok=p>=r.cost;return `<span class="bd ${ok?"ok":""}">${ok?"Bisa ditukar":"Kurang "+(r.cost-p)}</span>`};
/* ---- halaman ---- */
const PG={
home(){const n=D.next,pc=n?Math.min(100,Math.round(D.points/n.at*100)):100;
return `<div class="grid two mb"><div class="card feat"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><div class="lbl">Poin kamu</div><div class="kpi">${D.points}</div><span class="bd" style="background:#fff9">${E(D.tier)}</span></div><div class="code"><small>Kode member</small>${E(D.code)}</div></div><div class="lbl" style="margin-top:18px;display:flex;justify-content:space-between"><span>${E(D.tier)}</span><span>${n?E(n.name)+" \u00b7 "+n.at+" poin":"Level tertinggi"}</span></div><div class="pb"><i style="width:${pc}%"></i></div><div class="lbl" style="margin-top:8px">${n?`${n.at-D.points} poin lagi menuju ${E(n.name)}`:"Kamu sudah di level tertinggi"}</div></div>
<div class="card"><h2>Cara dapat poin</h2>${D.rules.map(r=>`<div class="sr"><span>${E(r.service)}</span><b>+${r.points} poin</b></div>`).join("")}</div></div>
<div class="grid two"><div class="card"><div class="fh"><h2>Hadiah untukmu</h2><button class="btn alt" data-go="rewards">Lihat semua</button></div>${D.rewards.map(r=>`<div class="sr"><div><b>${E(r.name)}</b><span class="lbl">${r.cost} poin</span></div>${status(D.points,r)}</div>`).join("")}</div>
<div class="card"><h2>Aktivitas terakhir</h2>${led(D.ledger.slice(0,4))}</div></div>`},
rewards(){return `<div class="card feat mb"><div class="lbl">Poin kamu</div><div class="kpi">${D.points}</div></div><div class="grid set mb">${D.rewards.map(r=>{const ok=D.points>=r.cost;return `<div class="card"><div class="fh"><h2>${E(r.name)}</h2>${status(D.points,r)}</div><p class="lbl" style="margin-bottom:12px">${r.cost} poin</p><button class="btn" data-rd="${r.id}" ${ok?"":"disabled"}>${ok?"Tukar sekarang":"Kurang "+(r.cost-D.points)+" poin"}</button></div>`}).join("")}</div>
<div class="card"><h2>Voucher saya</h2>${D.vouchers.length?tbl(["Kode","Hadiah","Status","QR"],D.vouchers.map(v=>[E(v.code),E(v.name),`<span class="bd ${v.status==="Aktif"?"ok":""}">${E(v.status)}</span>`, v.status==="Aktif"?`<button class="btn alt" data-qr="${E(v.code)}" data-qn="${E(v.name)}" style="width:auto;padding:0 14px;min-height:38px">Lihat QR</button>`:"—"])):`<p class="lbl">Belum ada voucher.</p>`}</div>`},
history(){return `<div class="card mb"><h2>Riwayat kunjungan</h2>${D.visits.length?tbl(["Tanggal","Layanan","Total","Poin"],D.visits.map(v=>[dt(v.date),E(v.service),rp(v.total),pts(v.points)])):`<p class="lbl">Belum ada kunjungan.</p>`}</div><div class="card"><h2>Riwayat poin</h2>${led(D.ledger)}</div>`},
profile(){return `<div class="card" style="max-width:640px;margin:0 auto"><div style="display:flex;gap:14px;align-items:center;margin-bottom:8px"><div class="av" style="width:64px;height:64px;font-size:22px">${E(D.name[0])}</div><div><b style="font-size:17px">${E(D.name)}</b><span class="lbl" style="display:block">Member ${E(D.tier)} \u00b7 ${D.points} poin</span></div></div>${[["No. HP",D.phone],["Kode member",D.code],["Member sejak",new Date(D.since).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})]].map(r=>`<div class="sr"><span class="lbl">${r[0]}</span><b>${E(r[1])}</b></div>`).join("")}<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px"><button class="btn alt" id="pinb">Ganti PIN</button><button class="btn alt" id="outb">Keluar</button></div></div>`},
settings(){const seg=(k,o)=>`<div class="seg3">${o.map(([v,l])=>`<button data-c="${k}" data-v='${JSON.stringify(v)}' class="${C[k]===v?"on":""}">${l}</button>`).join("")}</div>`,
vr=(t,d,c)=>`<div class="sr v"><div><b>${t}</b><span class="lbl">${d}</span></div>${c}</div>`,
tg=(k,t,d)=>`<button class="sr" data-t="${k}" role="switch" aria-checked="${!!C[k]}"><div><b>${t}</b><span class="lbl">${d}</span></div><span class="tg${C[k]?" on":""}"></span></button>`,
A=[["#FED950","Kuning"],["#F2C14E","Emas"],["#F4A340","Madu"],["#EAE26B","Lemon"]];
return `<div class="grid set"><div class="card"><h2>Tampilan</h2>${vr("Mode","Terang, gelap, atau ikuti perangkat.",seg("mode",[["light","Terang"],["dark","Gelap"],["auto","Otomatis"]]))}${vr("Warna aksen","Warna tombol dan indikator.",`<div class="sws">${A.map(a=>`<button class="sw${C.acc===a[0]?" on":""}" data-a="${a[0]}" style="background:${a[0]}" aria-label="${a[1]}"></button>`).join("")}</div>`)}${vr("Ukuran teks","Berlaku untuk isi halaman.",seg("fs",[[.9,"Kecil"],[1,"Normal"],[1.12,"Besar"]]))}${vr("Kepadatan","Ringkas menampilkan lebih banyak.",seg("dn",[["c","Ringkas"],["n","Nyaman"]]))}${vr("Sudut kartu","Kelengkungan kartu.",seg("rd",[[8,"Tajam"],[16,"Normal"],[24,"Bulat"]]))}</div>
<div class="grid"><div class="card"><h2>Aksesibilitas</h2>${tg("hc","Kontras tinggi","Garis dan teks sekunder lebih tegas.")}${tg("rm","Kurangi animasi","Matikan transisi dan gerakan.")}</div><div class="card"><button class="btn alt" id="rst">Atur ulang tampilan</button></div></div></div>`}};
const TT={settings:"Pengaturan"};
function render(){if(!PG[page])page="home";
$("ttl").textContent=page==="home"?"Halo, "+D.name.split(" ")[0]:(NAV.find(n=>n[0]===page)||[])[1]||TT[page];
const nv=NAV.map(([k,l,i])=>`<button class="nv${k===page?" on":""}" data-k="${k}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join("");
$("sb").innerHTML=`<div class="logo">TS</div>`+nv;$("bn").innerHTML=nv;$("gb").innerHTML=ic("set");$("avt").textContent=D.name[0];
$("pg").innerHTML=PG[page]();
const q=s=>document.querySelectorAll(s);
q(".nv").forEach(b=>b.onclick=()=>go(b.dataset.k));q("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
q("[data-rd]").forEach(b=>b.onclick=()=>redeem(+b.dataset.rd));
q("[data-qr]").forEach(b=>b.onclick=()=>showVoucher(b.dataset.qr,b.dataset.qn));
q("[data-c]").forEach(b=>b.onclick=()=>{C[b.dataset.c]=JSON.parse(b.dataset.v);apply();render()});
q("[data-a]").forEach(b=>b.onclick=()=>{C.acc=b.dataset.a;apply();render()});
q("[data-t]").forEach(b=>b.onclick=()=>{C[b.dataset.t]=C[b.dataset.t]?0:1;apply();render()});
const r=$("rst");if(r)r.onclick=()=>{C={...DF};apply();render()};
const o=$("outb");if(o)o.onclick=async()=>{try{await api("/logout",{method:"POST"})}catch(e){}D=null;await load()};
const p=$("pinb");if(p)p.onclick=pinSheet}
function go(k){page=k;history.replaceState(null,"","#"+k);render();scrollTo(0,0)}
$("gb").onclick=()=>go("settings");
function redeem(id){const r=D.rewards.find(x=>x.id===id);if(!r)return;
sheet(`<h2>Tukar hadiah</h2><p class="lbl" style="margin:8px 0 14px">Tukar ${r.cost} poin dengan ${E(r.name)}? Tunjukkan voucher ke kasir.</p><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn alt" id="no">Batal</button><button class="btn" id="ok">Tukar</button></div>`);
$("no").onclick=closeSheet;const key=crypto.randomUUID();
$("ok").onclick=async e=>{e.target.disabled=true;try{const j=await api("/rewards/"+id+"/redeem",{method:"POST",h:{"Idempotency-Key":key}});closeSheet();await load();showVoucher(j.code,r.name)}catch(x){closeSheet();toast(x.message);await load()}}}
function showVoucher(code,name){sheet(`<h2>Voucher berhasil dibuat</h2><p class="lbl" style="margin:8px 0 14px">Tunjukkan QR ini ke kasir untuk ditukar.</p><div style="text-align:center"><img src="/api/qr?text=${encodeURIComponent(code)}" alt="QR voucher" style="width:240px;max-width:100%;border:1px solid var(--bd);border-radius:14px;background:#fff;padding:8px"><div class="code" style="margin-top:12px">${E(name)}<small>${E(code)}</small></div></div><button class="btn" id="vclose" style="margin-top:12px">Tutup</button>`);$("vclose").onclick=closeSheet}
function pinSheet(){sheet(`<h2>Ganti PIN</h2><label class="lbl">PIN lama</label><input id="o1" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"><label class="lbl">PIN baru (6 digit)</label><input id="n1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><label class="lbl">Ulangi PIN baru</label><input id="n2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><div id="pe" class="lbl" style="color:#c96464;min-height:18px" role="alert"></div><button class="btn" id="ps">Simpan</button>`);
$("ps").onclick=async e=>{const o=$("o1").value,n=$("n1").value;if(!/^\d{6}$/.test(n))return $("pe").textContent="PIN baru harus 6 digit";if(n!==$("n2").value)return $("pe").textContent="Pengulangan PIN tidak sama";e.target.disabled=true;try{await api("/pin",{method:"POST",body:{oldPin:o,newPin:n}});closeSheet();toast("PIN diganti")}catch(x){$("pe").textContent=x.message;e.target.disabled=false}}}
apply();load();
</script>
</body>
</html>
